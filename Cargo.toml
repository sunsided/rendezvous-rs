[package]
name = "rendezvous"
version = "0.5.0"
description = "Easier rendezvous channels for thread synchronization"
authors = ["Markus Mayer <github@widemeadows.de>"]
repository = "https://github.com/sunsided/rendezvous-rs"
categories = ["asynchronous"]
license = "EUPL-1.2"
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[features]
log = ["dep:log"]
tracing = ["dep:tracing"]

[lints.rust]
# `rendezvous_loom` and `docsrs` are custom cfgs set via RUSTFLAGS / docs.rs metadata, not Cargo
# features. The loom cfg is crate-specific because RUSTFLAGS reach every crate in the build, and
# dev-dependencies (tokio, concurrent-queue, ...) have their own `cfg(loom)` code paths.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rendezvous_loom)', 'cfg(docsrs)'] }
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[dependencies]
log = { version = "0.4.20", optional = true }
pin-project-lite = "0.2.13"
tracing = { version = "0.1.40", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
async-io = "2.3.0"
futures-timer = "3.0.3"
tokio = { version = "1.34.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-test = "0.4.3"
tokio-util = "0.7.10"

# loom is pulled in only for model-checking runs (`--cfg rendezvous_loom`); the library code references
# `loom::sync` directly under that cfg, so it must be a normal (target-gated) dependency.
[target.'cfg(rendezvous_loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
