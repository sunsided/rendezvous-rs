[package]
name = "rendezvous"
version = "0.4.0"
description = "Easier rendezvous channels for thread synchronization"
authors = ["Markus Mayer <github@widemeadows.de>"]
homepage = "https://github.com/sunsided/rendezvous-rs"
repository = "https://github.com/sunsided/rendezvous-rs"
categories = ["asynchronous"]
license = "EUPL-1.2"
readme = "README.md"
edition = "2021"

[features]
log = ["dep:log"]
tokio = ["dep:tokio"]

[lints.rust]
# `loom` and `docsrs` are custom cfgs set via RUSTFLAGS / docs.rs metadata, not Cargo features.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(docsrs)'] }

[dependencies]
log = { version = "0.4.20", optional = true }
tokio = { version = "1.34.0", optional = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio-test = "0.4.3"

# loom is pulled in only for model-checking runs (`--cfg loom`); the library code references
# `loom::sync` directly under that cfg, so it must be a normal (target-gated) dependency.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
